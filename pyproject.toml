[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repobridge"
version = "0.1.0"
description = "Local-first tool that turns public GitHub repositories into grounded, structured context for LLM workflows."
requires-python = ">=3.10"
authors = [
  { name = "Pushkar0997" }
]

dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "jinja2>=3.1.3",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "sqlalchemy>=2.0.29",
  "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["repobridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "auto" rather than "strict": the GitHub client tests are entirely async, and
# auto mode collects them without a @pytest.mark.asyncio decorator on every
# test. (On pytest 9 / pytest-asyncio 1.4 an undecorated async test under
# strict mode fails loudly rather than being silently skipped, so this is a
# boilerplate choice, not a safety net.)
asyncio_mode = "auto"
