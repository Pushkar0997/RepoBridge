[project]
name = "repobridge"
version = "0.1.0"
description = "Local-first tool that turns public GitHub repositories into grounded, structured context for LLM workflows."
requires-python = ">=3.10"
authors = [
  { name = "Pushkar0997" }
]

dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "jinja2>=3.1.3",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "sqlalchemy>=2.0.29",
  "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
]

[tool.uvicorn]
factory = false
reload = true
port = 8000