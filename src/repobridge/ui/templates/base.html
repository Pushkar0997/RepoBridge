<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ title or "RepoBridge" }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header>
    {# The wordmark is the way home from every page, which is where people look for it. #}
    <h1><a href="/">RepoBridge</a></h1>
    <p>Local-first GitHub repo inspector for grounded LLM context.</p>
    <hr>
  </header>

  <main id="main" tabindex="-1">
    {% block content %}{% endblock %}
  </main>

  <footer>
    <hr>
    <small>RepoBridge v0.1 – local development build</small>
  </footer>

  <script src="/static/js/main.js"></script>
</body>
</html>
